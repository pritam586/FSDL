<!DOCTYPE html>
<html>
<head>
<title>Login / Signup</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
}

.container{
display:flex;
width:100%;
}

/* LEFT FORM */

.form-section{
width:50%;
display:flex;
justify-content:center;
align-items:center;
background:#f3f5fb;
}

.form-box{
width:320px;
}

h2{
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#2f7edb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#1c5fb5;
}

.switch{
margin-top:10px;
text-align:center;
}

.switch a{
color:#2f7edb;
cursor:pointer;
text-decoration:none;
}

/* RIGHT SIDE */

.image-section{
width:50%;
background:linear-gradient(120deg,#6fa3ff,#4b6cb7);
display:flex;
justify-content:center;
align-items:center;
}

.image-section img{
width:60%;
}

.error{
color:red;
font-size:13px;
}

.success{
color:green;
}

</style>

<script>

function showSignup(){
document.getElementById("loginForm").style.display="none";
document.getElementById("signupForm").style.display="block";
}

function showLogin(){
document.getElementById("signupForm").style.display="none";
document.getElementById("loginForm").style.display="block";
}

/* LIVE VALIDATION */

function validateSignup(){

let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let phone=document.getElementById("phone").value;
let pass=document.getElementById("pass").value;

let msg="";

if(name.length < 3)
msg="Name must be at least 3 characters";

else if(!email.includes("@"))
msg="Enter valid email";

else if(phone.length != 10)
msg="Phone must be 10 digits";

else if(pass.length < 6)
msg="Password must be at least 6 characters";

document.getElementById("validation").innerHTML=msg;

}

</script>

</head>

<body>

<div class="container">

<div class="form-section">

<div class="form-box">

<!-- LOGIN -->

<form id="loginForm" action="login.php" method="POST">

<h2>Log In</h2>

<input type="text" name="email" placeholder="Mobile or Email Id" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Log In</button>

<div class="switch">
Don't have account?
<a onclick="showSignup()">Register here</a>
</div>

</form>

<!-- SIGNUP -->

<form id="signupForm" action="signup.php" method="POST" style="display:none">

<h2>Sign Up</h2>

<input type="text" name="full_name" id="name" placeholder="Full Name" onkeyup="validateSignup()" required>

<input type="email" name="email" id="email" placeholder="Email" onkeyup="validateSignup()" required>

<input type="text" name="phone_number" id="phone" placeholder="Phone Number" onkeyup="validateSignup()" required>

<input type="password" name="password" id="pass" placeholder="Password" onkeyup="validateSignup()" required>

<p id="validation" class="error"></p>

<button type="submit">Register</button>

<div class="switch">
Already have account?
<a onclick="showLogin()">Login here</a>
</div>

</form>

</div>

</div>

<div class="image-section">
<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
</div>

</div>

</body>
</html>
